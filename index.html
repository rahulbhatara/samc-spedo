<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JGVRP / RageMP Speedometer CEF Overlay</title>
    
    <!-- External Fonts (CDN) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Clean CEF Stylesheet -->
    <link rel="stylesheet" href="cef.css">
</head>

<body>
    <!-- PIT SPEED WARNING (Toggled by setPitMode / setSpeed logic) -->
    <div id="pit-speed-warning">
        <div class="warning-title">🔴 SLOW DOWN!</div>
        <div class="warning-subtitle">PIT LANE SPEED LIMIT EXCEEDED (20 MPH)</div>
    </div>

    <!-- SPEEDOMETER HUD -->
    <div id="speedometer" class="speedo-dashboard">
        <!-- Floating HUD Controls (Fade in on hover) -->
        <div class="speedo-controls no-drag">
            <button id="btn-scale-down" class="control-btn" title="Scale Down">−</button>
            <button id="btn-reset" class="control-btn" title="Reset Position & Scale">↺</button>
            <button id="btn-scale-up" class="control-btn" title="Scale Up">+</button>
        </div>

        <!-- 2. Main Dials Panel -->
        <div class="speedo-panel dials-panel">
            <!-- Overlapping Dials Row -->
            <div class="speedo-dials-container">
                
                <!-- Speedometer Static Background SVG -->
                <svg class="speedo-svg speedo-speed speedo-bg-layer" viewBox="0 0 300 240">
                    <!-- Dial Background -->
                    <circle cx="150" cy="150" r="120" class="dial-bg" />
                    
                    <!-- Highlights (Speed zones) -->
                    <!-- Green (0-60 MPH) -->
                    <path d="M 46.6 187.6 A 110 110 0 0 1 169.1 41.7" class="zone-arc zone-green" />
                    <!-- Yellow (60-80 MPH) -->
                    <path d="M 169.1 41.7 A 110 110 0 0 1 234.3 79.3" class="zone-arc zone-yellow" />
                    <!-- Red (80-110 MPH) -->
                    <path d="M 234.3 79.3 A 110 110 0 0 1 253.4 187.6" class="zone-arc zone-red" />
                    
                    <!-- Ticks & Numbers (0-200 MPH) -->
                    <!-- 0 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(-110, 150, 150)" class="tick" />
                    <text x="64" y="181" class="dial-label">0</text>
                    <!-- 20 MPH -->
                    <line x1="150" y1="30" x2="150" y2="40" transform="rotate(-88, 150, 150)" class="tick-sub" />
                    <text x="58" y="147" class="dial-label">20</text>
                    <!-- 40 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(-66, 150, 150)" class="tick" />
                    <text x="66" y="113" class="dial-label">40</text>
                    <!-- 60 MPH -->
                    <line x1="150" y1="30" x2="150" y2="40" transform="rotate(-44, 150, 150)" class="tick-sub" />
                    <text x="86" y="84" class="dial-label">60</text>
                    <!-- 80 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(-22, 150, 150)" class="tick" />
                    <text x="116" y="65" class="dial-label">80</text>
                    <!-- 100 MPH -->
                    <line x1="150" y1="30" x2="150" y2="40" transform="rotate(0, 150, 150)" class="tick-sub" />
                    <text x="150" y="58" class="dial-label">100</text>
                    <!-- 120 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(22, 150, 150)" class="tick" />
                    <text x="184" y="65" class="dial-label">120</text>
                    <!-- 140 MPH -->
                    <line x1="150" y1="30" x2="150" y2="40" transform="rotate(44, 150, 150)" class="tick-sub" />
                    <text x="214" y="84" class="dial-label">140</text>
                    <!-- 160 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(66, 150, 150)" class="tick" />
                    <text x="234" y="113" class="dial-label">160</text>
                    <!-- 180 MPH -->
                    <line x1="150" y1="30" x2="150" y2="40" transform="rotate(88, 150, 150)" class="tick-sub" />
                    <text x="242" y="147" class="dial-label">180</text>
                    <!-- 200 MPH -->
                    <line x1="150" y1="30" x2="150" y2="42" transform="rotate(110, 150, 150)" class="tick" />
                    <text x="236" y="181" class="dial-label">200</text>
                </svg>
                
                <!-- Speedometer Dynamic Needle SVG -->
                <svg class="speedo-svg speedo-speed speedo-needle-layer" viewBox="0 0 300 240">
                    <!-- Needle -->
                    <line x1="150" y1="150" x2="150" y2="45" id="speedo-needle" class="dial-needle" />
                    <circle cx="150" cy="150" r="10" class="dial-cap-outer" />
                    <circle cx="150" cy="150" r="5" class="dial-cap-inner" />
                </svg>
                
                <!-- Overlay Gear Text & Speed Text -->
                <div class="gear-overlay-container">
                    <div id="gear-display" class="gear-overlay">N</div>
                </div>
                <div class="speed-overlay-container">
                    <span id="speed-display">0</span>
                    <span id="speed-unit">mph</span>
                    <span id="odometer" class="odometer-inline">0.0 mi</span>
                </div>

                <!-- RPM Static Background SVG -->
                <svg class="speedo-svg speedo-rpm speedo-bg-layer" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="80" class="dial-bg" />
                    
                    <!-- Highlights (Redline zone 9-11 RPM) -->
                    <path d="M 165.8 76.1 A 70 70 0 0 1 165.8 123.9" class="zone-arc zone-red" />
                    
                    <!-- Ticks & Numbers (0-11 x1000 RPM) -->
                    <!-- 0 RPM -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-110, 100, 100)" class="tick" />
                    <text x="44" y="125" class="dial-label-rpm label-left">0</text>
                    <!-- 1 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-90, 100, 100)" class="tick" />
                    <text x="40" y="104" class="dial-label-rpm label-left">1</text>
                    <!-- 2 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-70, 100, 100)" class="tick" />
                    <text x="44" y="83" class="dial-label-rpm label-left">2</text>
                    <!-- 3 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-50, 100, 100)" class="tick" />
                    <text x="54" y="65" class="dial-label-rpm">3</text>
                    <!-- 4 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-30, 100, 100)" class="tick" />
                    <text x="70" y="52" class="dial-label-rpm">4</text>
                    <!-- 5 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(-10, 100, 100)" class="tick" />
                    <text x="90" y="45" class="dial-label-rpm">5</text>
                    <!-- 6 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(10, 100, 100)" class="tick" />
                    <text x="110" y="45" class="dial-label-rpm">6</text>
                    <!-- 7 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(30, 100, 100)" class="tick" />
                    <text x="130" y="52" class="dial-label-rpm redline-label">7</text>
                    <!-- 8 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(50, 100, 100)" class="tick" />
                    <text x="146" y="65" class="dial-label-rpm redline-label">8</text>
                    <!-- 9 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(70, 100, 100)" class="tick" />
                    <text x="156" y="83" class="dial-label-rpm redline-label">9</text>
                    <!-- 10 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(90, 100, 100)" class="tick" />
                    <text x="160" y="104" class="dial-label-rpm redline-label">10</text>
                    <!-- 11 -->
                    <line x1="100" y1="20" x2="100" y2="28" transform="rotate(110, 100, 100)" class="tick" />
                    <text x="156" y="125" class="dial-label-rpm redline-label">11</text>
                    
                    <text x="100" y="145" class="rpm-unit">RPM</text>
                    <text x="100" y="157" class="rpm-multiplier">x1000</text>
                </svg>
                
                <!-- RPM Dynamic Needle SVG -->
                <svg class="speedo-svg speedo-rpm speedo-needle-layer" viewBox="0 0 200 200">
                    <!-- Needle -->
                    <line x1="100" y1="100" x2="100" y2="25" id="rpm-needle" class="dial-needle needle-rpm" />
                    <circle cx="100" cy="100" r="10" class="dial-cap-outer" />
                    <circle cx="100" cy="100" r="5" class="dial-cap-inner" />
                </svg>

                <!-- Status Indicators -->
                <div class="speedo-indicators">
                    <!-- Left turn signal SVG -->
                    <div id="indicator-left" class="indicator-unit indicator-arrow">
                        <svg viewBox="0 0 512 512" width="100%" height="100%">
                            <polygon points="316.508,153.598 316.508,18.616 0,256 316.508,493.384 316.508,358.402 512,358.402 512,153.598"/>
                        </svg>
                    </div>
                    
                    <!-- Headlights status SVG -->
                    <div id="indicator-headlights" class="indicator-unit indicator-headlight">
                        <svg viewBox="0 0 256 256" width="100%" height="100%">
                            <path d="M144,64V192a16.01833,16.01833,0,0,1-16,16H88A79.99987,79.99987,0,0,1,8.002,127.39453C8.32715,83.61621,44.61914,48,88.90381,48H128A16.01833,16.01833,0,0,1,144,64Zm96,104H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16ZM168,88h72a8,8,0,0,0,0-16H168a8,8,0,0,0,0,16Zm72,16H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Zm0,32H168a8,8,0,0,0,0,16h72a8,8,0,0,0,0-16Z"/>
                        </svg>
                    </div>

                    <!-- Seatbelt status SVG -->
                    <div id="indicator-seatbelt" class="indicator-unit indicator-seatbelt">
                        <svg viewBox="0 0 24 24" width="100%" height="100%">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    
                    <!-- Engine status SVG -->
                    <div id="indicator-engine" class="indicator-unit indicator-engine">
                        <svg viewBox="0 0 32 32" width="100%" height="100%">
                            <path d="M31,22.6c-0.9,0.2-1.8,0-2.1-0.6c-0.4-0.6-0.1-1.4,0.5-2.1c-0.7-0.7-1.7-1.3-2.7-1.6c-0.3,0.9-0.9,1.5-1.6,1.5 c-0.7,0-1.3-0.6-1.6-1.5c-1,0.3-2,0.8-2.7,1.6c0.6,0.7,0.9,1.5,0.5,2.1c-0.4,0.6-1.2,0.8-2.1,0.6c-0.1,0.5-0.2,1-0.2,1.6 s0.1,1.1,0.2,1.6c0.9-0.2,1.8,0,2.1,0.6c0.4,0.6,0.1,1.4-0.5,2.1c0.7,0.7,1.7,1.3,2.7,1.6c0.3-0.9,0.9-1.5,1.6-1.5 c0.7,0,1.3,0.6,1.6,1.5c1-0.3,2-0.8,2.7-1.6c-0.6-0.7-0.9-1.5-0.5-2.1c0.4-0.6,1.2-0.8,2.1-0.6c0.1-0.5,0.2-1,0.2-1.6 S31.1,23.1,31,22.6z"/>
                            <line x1="25" y1="24" x2="25" y2="24"/>
                            <path d="M24,13H4l2-4.6C6.6,7,8,6,9.6,6h8.7c1.6,0,3,1,3.7,2.4L24,13z"/>
                            <path d="M8,23H2v2c0,1.1,0.9,2,2,2h2c1.1,0,2-0.9,2-2V23z"/>
                            <line x1="1" y1="12" x2="4.4" y2="12"/>
                            <line x1="24" y1="12" x2="27" y2="12"/>
                            <path d="M19,23H9l1.4-2.9c0.3-0.7,1-1.1,1.8-1.1h3.5c0.8,0,1.5,0.4,1.8,1.1L19,23z"/>
                            <line x1="4" y1="18" x2="7" y2="18"/>
                            <path d="M19.3,23H3c-1.1,0-2-0.9-2-2v-4c0-2.2,1.8-4,4-4h18c2.2,0,4,1.8,4,4v1.3"/>
                        </svg>
                    </div>

                    <!-- Right turn signal SVG -->
                    <div id="indicator-right" class="indicator-unit indicator-arrow">
                        <svg viewBox="0 0 512 512" width="100%" height="100%">
                            <polygon points="512,256.001 195.491,18.616 195.491,153.599 0,153.599 0,358.403 195.491,358.403 195.491,493.384"/>
                        </svg>
                    </div>
                </div>

            </div>

            <!-- Bottom Status Capsule (HP on left, Fuel on right) -->
            <div class="bottom-status-capsule">
                <!-- Engine HP Gauge -->
                <div class="linear-gauge-container">
                    <span class="linear-icon">
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path fill="#2ecc71" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                        </svg>
                    </span>
                    <div class="linear-progress-bar">
                        <div id="health-fill" class="progress-fill health-bar-fill" style="width: 100%"></div>
                        <span id="health-text" class="linear-value">100%</span>
                    </div>
                </div>
                <!-- Fuel Gauge -->
                <div class="linear-gauge-container">
                    <span class="linear-icon">
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path fill="#f1c40f" d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33a2.5 2.5 0 002.5 2.5c.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5a2.5 2.5 0 005 0V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5z"/>
                        </svg>
                    </span>
                    <div class="linear-progress-bar">
                        <div id="fuel-fill" class="progress-fill fuel-bar-fill" style="width: 100%"></div>
                        <span id="fuel-text" class="linear-value">100%</span>
                    </div>
                </div>
            </div>

        </div>


    </div>

    <!-- Main Logic Script -->
    <script src="cef.js"></script>
</body>

</html>
